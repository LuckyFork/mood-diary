name: Journal checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --check core.js && node --check app.js
      - run: npm test
      - name: Real Chrome browser checks
        env:
          CHROME_PATH: google-chrome
        run: npm run test:browser
