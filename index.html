<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>心晴日记 · 情绪日记与自我关怀</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#2f3436;--sub:#7b8489;--line:#ece8e3;--brand:#5f9e8c;--soft:#e8f1ee}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#eef6f3 0%,#faf7f4 45%,#f6f4f1 100%);
  color:var(--ink);min-height:100vh;padding:22px 14px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto}
header{text-align:center;margin-bottom:18px}
h1{font-size:21px;letter-spacing:1px}
header p{font-size:12.5px;color:var(--sub);margin-top:6px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;
  box-shadow:0 2px 14px rgba(90,110,105,.07)}
h2{font-size:14.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}
.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mood{background:#fafafa;border:1.5px solid var(--line);border-radius:12px;padding:9px 2px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--sub);transition:.18s}
.mood .e{font-size:21px;line-height:1}
.mood.on{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:600;transform:translateY(-2px)}
.row{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--sub)}
input[type=range]{flex:1;accent-color:var(--brand)}
.triggers{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.tag{border:1px solid var(--line);background:#fafafa;border-radius:999px;
  padding:5px 12px;font-size:12px;color:var(--sub);cursor:pointer;transition:.15s}
.tag.on{background:var(--brand);border-color:var(--brand);color:#fff}
textarea{width:100%;margin-top:14px;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:13px;resize:vertical;font-family:inherit;outline:none;background:#fafafa}
textarea:focus{border-color:var(--brand);background:#fff}
button.primary{width:100%;margin-top:14px;padding:12px;border:0;border-radius:11px;
  background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.18s}
button.primary:hover{opacity:.9}
button.primary:active{transform:scale(.99)}
button.ghost{width:100%;margin-top:12px;padding:10px;border:1px dashed var(--brand);
  border-radius:11px;background:#fff;color:var(--brand);font-size:13px;cursor:pointer}
.pill{font-size:11px;font-weight:400;color:var(--brand);background:var(--soft);
  border-radius:999px;padding:2px 9px}
.care-item{display:flex;gap:10px;font-size:13px;line-height:1.65;padding:9px 0;
  border-bottom:1px dashed var(--line);color:#454b4d}
.care-item:last-child{border-bottom:0}
.care-item i{font-style:normal;color:var(--brand);font-weight:700;flex-shrink:0}
.breath{text-align:center;padding-top:8px}
.circle{width:110px;height:110px;border-radius:50%;margin:14px auto 10px;
  background:radial-gradient(circle at 32% 30%,#b3ddd0,#5f9e8c);
  transition:transform 4s ease-in-out;box-shadow:0 6px 20px rgba(95,158,140,.28)}
#breathText{font-size:13px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;
  padding:0 4px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.col{width:60%;border-radius:5px 5px 0 0;transition:.3s}
.bar span{font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.top .chip{font-size:12px;background:#fdf3e7;color:#b5824a;border-radius:999px;padding:4px 11px}
.entry{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.entry:last-child{border-bottom:0}
.entry .em{font-size:22px;line-height:1.2}
.entry .body{flex:1;min-width:0}
.entry .meta{font-size:11.5px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.entry .note{color:#4c5254;margin-top:5px;line-height:1.6;word-break:break-word}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--brand);opacity:.25}
.dots i.f{opacity:1}
.del{background:none;border:0;color:#c9cdcf;font-size:16px;cursor:pointer;padding:0 2px}
.del:hover{color:#e08e6d}
.empty{font-size:12.5px;color:var(--sub);text-align:center;padding:14px 0}
.foot{font-size:11.5px;color:#a3abae;text-align:center;line-height:1.8;margin-top:6px}
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);
  background:rgba(47,52,54,.92);color:#fff;font-size:13px;padding:10px 20px;border-radius:999px;
  opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>心晴日记</h1>
    <p>记录情绪 · 看见触发 · 好好照顾自己</p>
  </header>

  <section class="card">
    <h2>此刻你的感受是？</h2>
    <div class="moods" id="moods"></div>
    <div class="row">
      <label>强度</label>
      <input type="range" id="intensity" min="1" max="5" value="3">
      <span id="intensityVal" style="width:14px">3</span>
    </div>
    <div class="triggers" id="triggers"></div>
    <textarea id="note" rows="2" placeholder="想对自己说点什么？（选填）"></textarea>
    <button class="primary" id="save">保存这一条</button>
  </section>

  <section class="card">
    <h2>为你推荐 <span class="pill" id="careFor">平静</span></h2>
    <div id="careList"></div>
    <button class="ghost" id="breathBtn">跟我呼吸 30 秒 →</button>
    <div class="breath" id="breathBox" hidden>
      <div class="circle" id="breathCircle"></div>
      <p id="breathText">准备…</p>
    </div>
  </section>

  <section class="card">
    <h2>最近 7 次情绪</h2>
    <div id="trend"></div>
    <div class="top" id="topTriggers"></div>
  </section>

  <section class="card">
    <h2>情绪时间线</h2>
    <div id="timeline"></div>
  </section>

  <p class="foot">
    数据仅保存在你的浏览器本地，不会上传任何服务器。<br>
    如果低落、焦虑持续两周以上并影响生活，请寻求专业心理帮助。
  </p>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'mood-diary-v1';
const MOODS = [
  {key:'happy',  emoji:'😄', label:'开心', val:5, color:'#f0c04a'},
  {key:'calm',   emoji:'😌', label:'平静', val:4, color:'#7ec8a9'},
  {key:'tired',  emoji:'😴', label:'疲惫', val:3, color:'#9aa7c7'},
  {key:'low',    emoji:'😔', label:'低落', val:2, color:'#8b9dc3'},
  {key:'anxious',emoji:'😰', label:'焦虑', val:2, color:'#e0936d'},
  {key:'angry',  emoji:'😤', label:'烦躁', val:2, color:'#d97a7a'}
];
const TRIGGERS = ['学业','工作','人际关系','家庭','健康','睡眠','金钱','天气','自我评价','其他'];
const CARE = {
  happy:  ['把这份开心写具体：发生了什么？它会成为你的「能量储蓄罐」','分享给一个朋友，快乐会翻倍','趁热打铁做一件小事，把好状态延续下去'],
  calm:   ['保持 5 分钟正念呼吸，让身体记住这种平静','整理桌面或待办清单，秩序感会让平静更稳','给未来的自己写一句提醒'],
  tired:  ['20 分钟小睡，或闭眼躺平不看手机','睡前 1 小时断网，把屏幕换成纸质书','泡个热水脚，让身体先于大脑放松'],
  low:    ['出门散步 10 分钟，晒太阳是最便宜的情绪药','听 3 首「安全歌单」里的老歌','写下今天 3 件小事，哪怕只是「吃了一顿热饭」'],
  anxious:['4-7-8 呼吸法：吸 4 秒、屏 7 秒、呼 8 秒，做 4 轮','5-4-3-2-1 接地：说出 5 个看到的、4 个摸到的、3 个听到的、2 个闻到的、1 个尝到的','把担心写成两列：能控制的 / 不能控制的，只处理左边'],
  angry:  ['冷水洗把脸或握冰块 30 秒，让身体先降温','快走或跑 10 分钟，把肾上腺素用掉','把想说的话全写下来，但先不要发送']
};

let store = [];
try { store = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { store = []; }

let selectedMood = null;
const selectedTriggers = new Set();

/* ---------- 渲染选择区 ---------- */
const moodsEl = document.getElementById('moods');
MOODS.forEach(m => {
  const b = document.createElement('button');
  b.className = 'mood';
  b.innerHTML = '<span class="e">' + m.emoji + '</span><span>' + m.label + '</span>';
  b.onclick = () => {
    selectedMood = m.key;
    document.querySelectorAll('.mood').forEach(x => x.classList.toggle('on', x === b));
    renderCare();
  };
  moodsEl.appendChild(b);
});

const trigEl = document.getElementById('triggers');
TRIGGERS.forEach(t => {
  const b = document.createElement('button');
  b.className = 'tag';
  b.textContent = t;
  b.onclick = () => {
    if (selectedTriggers.has(t)) { selectedTriggers.delete(t); b.classList.remove('on'); }
    else { selectedTriggers.add(t); b.classList.add('on'); }
  };
  trigEl.appendChild(b);
});

const intensity = document.getElementById('intensity');
intensity.oninput = () => document.getElementById('intensityVal').textContent = intensity.value;

/* ---------- 保存 ---------- */
document.getElementById('save').onclick = () => {
  if (!selectedMood) { toast('先选一个此刻的情绪吧'); return; }
  store.unshift({
    id: Date.now(),
    mood: selectedMood,
    intensity: Number(intensity.value),
    triggers: [...selectedTriggers],
    note: document.getElementById('note').value.trim(),
    ts: Date.now()
  });
  persist();
  selectedMood = null;
  selectedTriggers.clear();
  document.querySelectorAll('.mood').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tag').forEach(x => x.classList.remove('on'));
  document.getElementById('note').value = '';
  intensity.value = 3;
  document.getElementById('intensityVal').textContent = '3';
  renderAll();
  toast('已记录，谢谢你愿意照顾自己 🌿');
};

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(store.slice(0, 200))); } catch(e) {}
}

/* ---------- 趋势 ---------- */
function renderTrend() {
  const el = document.getElementById('trend');
  const recent = store.slice(0, 7).reverse();
  if (!recent.length) {
    el.innerHTML = '<p class="empty">还没有记录，从上面选一个情绪开始吧。</p>';
  } else {
    el.innerHTML = '<div class="bars">' + recent.map(r => {
      const m = MOODS.find(x => x.key === r.mood) || MOODS[1];
      return '<div class="bar"><div class="col" style="height:' + (r.intensity * 18 + 12) +
        'px;background:' + m.color + '"></div><span>' + m.emoji + '</span></div>';
    }).join('') + '</div>';
  }
  const count = {};
  store.forEach(r => (r.triggers || []).forEach(t => count[t] = (count[t] || 0) + 1));
  const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 3);
  document.getElementById('topTriggers').innerHTML = top.length
    ? '<span style="font-size:12px;color:#7b8489">高频触发因素：</span>' +
      top.map(t => '<span class="chip">' + t[0] + ' ×' + t[1] + '</span>').join('')
    : '';
}

/* ---------- 时间线 ---------- */
function fmt(ts) {
  const d = new Date(ts), now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (d.toDateString() === now.toDateString()) return '今天 ' + hm;
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
}
function renderTimeline() {
  const el = document.getElementById('timeline');
  if (!store.length) { el.innerHTML = '<p class="empty">你的第一条情绪记录，会出现在这里。</p>'; return; }
  el.innerHTML = store.slice(0, 20).map(r => {
    const m = MOODS.find(x => x.key === r.mood) || MOODS[1];
    const dots = Array.from({length: 5}, (_, i) =>
      '<i class="' + (i < r.intensity ? 'f' : '') + '"></i>').join('');
    const tags = (r.triggers || []).map(t => '#' + t).join(' ');
    return '<div class="entry"><div class="em">' + m.emoji + '</div><div class="body">' +
      '<div>' + m.label + ' <span class="dots">' + dots + '</span></div>' +
      (r.note ? '<div class="note">' + escapeHtml(r.note) + '</div>' : '') +
      '<div class="meta"><span>' + fmt(r.ts) + '</span>' + (tags ? '<span>' + tags + '</span>' : '') + '</div>' +
      '</div><button class="del" data-id="' + r.id + '">×</button></div>';
  }).join('');
  el.querySelectorAll('.del').forEach(b => {
    b.onclick = () => {
      store = store.filter(x => String(x.id) !== b.dataset.id);
      persist(); renderAll();
    };
  });
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 自我关怀 ---------- */
function renderCare() {
  const key = selectedMood || (store[0] && store[0].mood) || 'calm';
  const m = MOODS.find(x => x.key === key) || MOODS[1];
  document.getElementById('careFor').textContent = '针对「' + m.label + '」';
  document.getElementById('careList').innerHTML = (CARE[key] || CARE.calm).map((t, i) =>
    '<div class="care-item"><i>' + (i + 1) + '</i><span>' + t + '</span></div>').join('');
}

/* ---------- 呼吸引导 ---------- */
let breathTimer = null;
document.getElementById('breathBtn').onclick = () => {
  const box = document.getElementById('breathBox');
  box.hidden = false;
  const circle = document.getElementById('breathCircle');
  const txt = document.getElementById('breathText');
  const phases = [['吸气', 4000, 1.32], ['屏息', 4000, 1.32], ['呼气', 6000, 0.82]];
  let i = 0, cycles = 0;
  clearTimeout(breathTimer);
  (function step() {
    const p = phases[i % 3];
    txt.textContent = p[0] + ' ' + (p[1] / 1000) + ' 秒';
    circle.style.transform = 'scale(' + p[2] + ')';
    i++;
    if (i % 3 === 0) cycles++;
    if (cycles >= 3) {
      txt.textContent = '完成，现在感觉如何？';
      circle.style.transform = 'scale(1)';
      return;
    }
    breathTimer = setTimeout(step, p[1]);
  })();
};

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 初始化 ---------- */
function renderAll() { renderTrend(); renderTimeline(); renderCare(); }
renderAll();
</script>
</body>
</html>
